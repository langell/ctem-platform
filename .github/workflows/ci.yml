name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nx auto-loads .env into task environments; services need DATABASE_APP_URL
      # from it so RLS actually applies to them.
      - name: Environment
        run: cp .env.example .env

      # The generated Prisma client lives in gitignored src/generated — nothing
      # compiles until this runs. Needs no database.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Build (typecheck + dist for the e2e stack)
        run: pnpm build

      - name: Build web UI
        run: pnpm build:web

      - name: Unit tests
        run: pnpm test

      - name: Start infra
        run: |
          docker compose up -d postgres redis nats minio minio-init
          until docker compose exec -T postgres pg_isready -U ctem >/dev/null 2>&1; do sleep 1; done

      - name: Migrate + row-level security
        run: |
          pnpm db:deploy
          docker compose exec -T postgres psql -U ctem -d ctem \
            -f /dev/stdin < libs/db/prisma/manual/000_rls.sql

      # Runs after the unit tests above. Postgres is the compose service
      # started in the previous step (not a GitHub Actions service container).
      - name: Integration tests
        run: pnpm test:int

      # Same stub the UI smoke job starts. Discovery must not call api.github.com.
      - name: Start GitHub stub
        run: |
          node apps/github-stub/server.mjs > /tmp/github-stub.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -sf -m 2 http://127.0.0.1:4019/health >/dev/null; then
              echo "github stub ready"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::GitHub stub did not become ready"
          cat /tmp/github-stub.log
          exit 1

      - name: Point the stack at the GitHub stub
        run: |
          # e2e stack only. GITHUB_API_URL is reserved by GitHub Actions, so the
          # stub is CTEM_GITHUB_API_URL. Production compose hardcodes that key
          # to https://api.github.com.
          if grep -q '^CTEM_GITHUB_API_URL=' .env; then
            sed -i 's|^CTEM_GITHUB_API_URL=.*|CTEM_GITHUB_API_URL=http://127.0.0.1:4019|' .env
          else
            echo 'CTEM_GITHUB_API_URL=http://127.0.0.1:4019' >> .env
          fi
          grep '^CTEM_GITHUB_API_URL=' .env
          grep '^NODE_ENV=' .env

      - name: Start services
        env:
          # Actions cannot override GITHUB_API_URL. This name is the one
          # asset-service reads. There is no EGRESS_GITHUB_API env var.
          CTEM_GITHUB_API_URL: http://127.0.0.1:4019
          NODE_ENV: development
          NX_LOAD_DOT_ENV_FILES: 'true'
        run: |
          pnpm nx reset >/dev/null 2>&1 || true
          pnpm nx run-many -t dev --parallel=16 --exclude=@ctem/web > /tmp/stack.log 2>&1 &
          healthy=0
          for i in $(seq 1 90); do
            ok=1
            for port in 3000 3001 3002 3003 3004 3005 3006 3007; do
              curl -sf -m 2 "http://localhost:$port/health/live" >/dev/null 2>&1 || { ok=0; break; }
            done
            if [ "$ok" = "1" ]; then echo "all services healthy"; healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::services failed to become healthy"
            tail -150 /tmp/stack.log
            exit 1
          fi
          origin_ok=0
          for i in $(seq 1 20); do
            if grep -q '"githubApiOrigin":"http://127.0.0.1:4019"' /tmp/stack.log; then
              origin_ok=1
              break
            fi
            sleep 0.25
          done
          if [ "$origin_ok" != "1" ]; then
            echo "::error::asset-service did not boot against the GitHub stub (refusing to call api.github.com)"
            grep githubApiOrigin /tmp/stack.log || true
            tail -80 /tmp/stack.log
            exit 1
          fi
          echo "asset-service github api origin is the stub"

      # Queries OSV, CISA KEV and FIRST EPSS live — runners have internet.
      # GitHub discovery uses the stub started above, not api.github.com.
      - name: E2E smoke
        run: |
          pnpm e2e
          echo "---- github stub ----"
          cat /tmp/github-stub.log
          grep -E '^GET /users/langell/repos 200$' /tmp/github-stub.log

      - name: Service logs on failure
        if: failure()
        run: |
          echo "---- github stub ----"
          cat /tmp/github-stub.log 2>/dev/null || true
          echo "---- stack ----"
          tail -300 /tmp/stack.log 2>/dev/null || true

  # Phase A: optional browser smoke. Not a merge gate — required checks stay
  # lint / unit / int / PAT e2e. Promote to required in a later phase.
  ui-smoke:
    name: UI smoke (optional Phase A)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Environment
        run: cp .env.example .env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build services + web UI
        run: |
          pnpm build
          pnpm build:web

      - name: Start infra (including Keycloak)
        run: |
          docker compose up -d
          until docker compose exec -T postgres pg_isready -U ctem >/dev/null 2>&1; do sleep 1; done
          for i in $(seq 1 120); do
            if curl -sf -m 2 "http://localhost:8080/realms/ctem" >/dev/null 2>&1; then
              echo "keycloak realm ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Keycloak realm ctem did not become ready"
          docker compose logs --tail=80 keycloak
          exit 1

      - name: Migrate + RLS + demo seed
        run: |
          pnpm db:deploy
          docker compose exec -T postgres psql -U ctem -d ctem \
            -f /dev/stdin < libs/db/prisma/manual/000_rls.sql
          pnpm db:seed

      - name: Start GitHub stub
        run: |
          node apps/github-stub/server.mjs > /tmp/github-stub.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -sf -m 2 http://127.0.0.1:4019/health >/dev/null; then
              echo "github stub ready"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::GitHub stub did not become ready"
          cat /tmp/github-stub.log
          exit 1

      - name: Point the UI stack at the GitHub stub
        run: |
          # e2e stack only. GITHUB_API_URL is reserved by GitHub Actions, so the
          # stub is CTEM_GITHUB_API_URL. Production compose hardcodes that key
          # to https://api.github.com.
          if grep -q '^CTEM_GITHUB_API_URL=' .env; then
            sed -i 's|^CTEM_GITHUB_API_URL=.*|CTEM_GITHUB_API_URL=http://127.0.0.1:4019|' .env
          else
            echo 'CTEM_GITHUB_API_URL=http://127.0.0.1:4019' >> .env
          fi
          grep '^CTEM_GITHUB_API_URL=' .env
          grep '^NODE_ENV=' .env

      - name: Start services
        env:
          # Actions cannot override GITHUB_API_URL. This name is the one
          # asset-service reads. There is no EGRESS_GITHUB_API env var.
          CTEM_GITHUB_API_URL: http://127.0.0.1:4019
          NODE_ENV: development
          NX_LOAD_DOT_ENV_FILES: 'true'
        run: |
          pnpm nx reset >/dev/null 2>&1 || true
          pnpm nx run-many -t dev --parallel=16 --exclude=@ctem/web --exclude=@ctem/web-e2e > /tmp/stack.log 2>&1 &
          for i in $(seq 1 90); do
            ok=1
            for port in 3000 3001 3002 3003 3004 3005 3006 3007; do
              curl -sf -m 2 "http://localhost:$port/health/live" >/dev/null 2>&1 || { ok=0; break; }
            done
            if [ "$ok" = "1" ]; then echo "all services healthy"; break; fi
            sleep 2
          done
          if ! curl -sf -m 2 http://localhost:3002/health/live >/dev/null 2>&1; then
            echo "::error::services failed to become healthy"
            tail -150 /tmp/stack.log
            exit 1
          fi
          origin_ok=0
          for i in $(seq 1 20); do
            if grep -q '"githubApiOrigin":"http://127.0.0.1:4019"' /tmp/stack.log; then
              origin_ok=1
              break
            fi
            sleep 0.25
          done
          if [ "$origin_ok" != "1" ]; then
            echo "::error::asset-service did not boot against the GitHub stub (refusing to call api.github.com)"
            grep githubApiOrigin /tmp/stack.log || true
            tail -80 /tmp/stack.log
            exit 1
          fi
          echo "asset-service github api origin is the stub"

      - name: Install Playwright Chromium
        run: pnpm --filter @ctem/web-e2e exec playwright install --with-deps chromium

      - name: Playwright UI smoke
        run: |
          pnpm test:ui
          echo "---- github stub ----"
          cat /tmp/github-stub.log
          grep -E '^GET /user 200$' /tmp/github-stub.log

      - name: Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-smoke
          path: |
            apps/web-e2e/test-results
            apps/web-e2e/playwright-report
          if-no-files-found: ignore

      - name: Service logs on failure
        if: failure()
        run: |
          echo "---- github stub ----"
          cat /tmp/github-stub.log 2>/dev/null || true
          echo "---- stack ----"
          tail -300 /tmp/stack.log 2>/dev/null || true

  brochure:
    name: Brochure links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Six pages and internal links
        run: node tools/check-brochure.mjs
