name: ctem

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ctem
      POSTGRES_PASSWORD: ctem
      POSTGRES_DB: ctem
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctem']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes:
      - redisdata:/data

  nats:
    image: nats:2.11-alpine
    # JetStream is required — the event bus relies on durable consumers.
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports: ['4222:4222', '8222:8222']
    volumes:
      - natsdata:/data

  minio:
    # Frozen on purpose: MinIO stopped publishing community images in late 2025.
    # RELEASE.2025-09-07T16-13-09Z is the last published server image. Docker Hub
    # removed minio/minio, and quay.io/minio rejects anonymous pulls, so CI pulls
    # this digest (that release's multi-arch manifest list) from the public mirror.
    # The pin keeps the image reproducible.
    image: quay.io/thanos/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ctem
      MINIO_ROOT_PASSWORD: ctem-secret
    ports: ['9000:9000', '9001:9001']
    volumes:
      - miniodata:/data

  # Creates the artifact bucket on first boot so services do not have to.
  # Same frozen server image as minio: it ships mc RELEASE.2025-08-13T08-35-41Z,
  # the last published client. minio/mc is gone from Docker Hub and quay.io/minio/mc
  # rejects anonymous pulls. Frozen on purpose so the init image stays reproducible.
  minio-init:
    image: quay.io/thanos/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ctem ctem-secret; do sleep 1; done;
      mc mb --ignore-existing local/ctem-artifacts;
      mc anonymous set none local/ctem-artifacts;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--http-port=8080', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ['8080:8080']
    volumes:
      # Local-only realm: issuer http://localhost:8080/realms/ctem, demo analyst,
      # confidential ctem-api (demo-token) + public ctem-web (PKCE browser login).
      - ./deploy/keycloak/ctem-realm.json:/opt/keycloak/data/import/ctem-realm.json:ro

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
