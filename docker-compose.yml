name: ctem

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ctem
      POSTGRES_PASSWORD: ctem
      POSTGRES_DB: ctem
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctem']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes:
      - redisdata:/data

  nats:
    image: nats:2.11-alpine
    # JetStream is required — the event bus relies on durable consumers.
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports: ['4222:4222', '8222:8222']
    volumes:
      - natsdata:/data

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ctem
      MINIO_ROOT_PASSWORD: ctem-secret
    ports: ['9000:9000', '9001:9001']
    volumes:
      - miniodata:/data

  # Creates the artifact bucket on first boot so services do not have to.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ctem ctem-secret; do sleep 1; done;
      mc mb --ignore-existing local/ctem-artifacts;
      mc anonymous set none local/ctem-artifacts;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ['8080:8080']

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
